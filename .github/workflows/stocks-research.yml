name: stocks research (one-off)
on:
  push:
    branches: [research-stocks]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4
      - run: cd research && python tc14_pull.py
      - name: commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/out && git commit -q -m "research data" && git push origin HEAD:research-stocks
