name: collect-market-data
on:
  schedule:
    - cron: "7,37 0-21 * * 1-5"   # every 30 min, 00:00-21:59 UTC, Mon-Fri (Asia, Europe and US sessions)
  workflow_dispatch:
    inputs:
      mode:
        description: "update or backfill (2 years of daily history)"
        default: "update"
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance curl_cffi
      - run: python collector.py "${{ github.event.inputs.mode || 'update' }}"
      - name: commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
